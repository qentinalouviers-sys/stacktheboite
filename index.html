<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1410">
<meta name="description" content="Empilez les boîtes à pizza QENTINA.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QENTINA STACK">
<title>QENTINA STACK</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <div id="best">MEILLEUR 0</div>
    <div id="perfect"></div>
  </div>

  <button id="haptics-toggle" type="button" aria-pressed="true" aria-label="Vibration activée">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect class="phone" x="8.5" y="4" width="7" height="16" rx="1.6"/>
      <path class="waves" d="M5 9v6M2.6 10.5v3M19 9v6M21.4 10.5v3"/>
      <path class="cross" d="M4 4l16 16"/>
    </svg>
  </button>

  <div id="start" class="overlay">
    <p class="pulse">TAPEZ POUR EMPILER</p>
  </div>

  <div id="end" class="overlay hidden">
    <p id="end-record" class="record hidden">NOUVEAU RECORD</p>
    <p class="label">BOÎTES EMPILÉES</p>
    <p id="end-score">0</p>
    <p id="end-best" class="label">MEILLEUR 0</p>
    <p class="pulse small">TAPEZ POUR REJOUER</p>
  </div>

  <div id="debug"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
