name: Publie le site sur gh-pages

# On publie en poussant sur la branche gh-pages plutôt qu'en passant par
# l'API Pages : celle-ci exige des droits que le GITHUB_TOKEN d'un workflow
# n'a pas sur ce dépôt. Ici, contents: write suffit.

on:
  push:
    branches: [claude/new-session-k04edj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On ne publie que ce qui sert au jeu : ni README, ni workflow.
      # Le .nojekyll est indispensable : Jekyll exclut vendor/ par défaut,
      # ce qui supprimerait Three.js du site servi.
      - name: Assemble le site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest icon.svg _site/
          cp -r src vendor _site/
          touch _site/.nojekyll

      # GitHub Pages sert tout en max-age=600 : sans empreinte dans les URL, un
      # navigateur peut resservir les anciens modules ES pendant dix minutes
      # après une mise en ligne, et on croit que le déploiement a échoué.
      # On tamponne donc la version sur chaque import interne.
      - name: Tamponne la version sur les URL
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s|(from '\./[A-Za-z0-9_-]+\.js)'|\1?v=$V'|g" _site/src/*.js
          sed -i -E "s|(\"\./vendor/three\.module\.min\.js)\"|\1?v=$V\"|" _site/index.html
          sed -i -E "s|(src=\"src/main\.js)\"|\1?v=$V\"|" _site/index.html
          sed -i -E "s|(href=\"styles\.css)\"|\1?v=$V\"|" _site/index.html
          echo "Version tamponnée : $V"
          grep -o "from '\./[^']*'" _site/src/main.js | head -3

      - name: Pousse sur gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Déploie ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            gh-pages
